<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator Web Application</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #1e293b;
            font-family: Arial, sans-serif;
        }

        .calculator {
            width: 330px;
            padding: 20px;
            background: #111827;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h2 {
            text-align: center;
            color: white;
            margin-bottom: 15px;
        }

        #display {
            width: 100%;
            height: 70px;
            margin-bottom: 15px;
            padding: 10px;
            border: none;
            border-radius: 10px;
            background: #374151;
            color: white;
            font-size: 30px;
            text-align: right;
            outline: none;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            height: 60px;
            border: none;
            border-radius: 10px;
            font-size: 20px;
            cursor: pointer;
            background: #4b5563;
            color: white;
        }

        button:hover {
            background: #6b7280;
        }

        .operator {
            background: #2563eb;
        }

        .clear {
            background: #dc2626;
        }

        .equal {
            background: #16a34a;
        }

        .zero {
            grid-column: span 2;
        }
    </style>
</head>

<body>

<div class="calculator">

    <h2>Calculator</h2>

    <input type="text" id="display" value="0" readonly>

    <div class="buttons">

        <button class="clear" onclick="clearDisplay()">C</button>
        <button onclick="deleteLast()">DEL</button>
        <button onclick="addValue('%')">%</button>
        <button class="operator" onclick="addValue('/')">÷</button>

        <button onclick="addValue('7')">7</button>
        <button onclick="addValue('8')">8</button>
        <button onclick="addValue('9')">9</button>
        <button class="operator" onclick="addValue('*')">×</button>

        <button onclick="addValue('4')">4</button>
        <button onclick="addValue('5')">5</button>
        <button onclick="addValue('6')">6</button>
        <button class="operator" onclick="addValue('-')">−</button>

        <button onclick="addValue('1')">1</button>
        <button onclick="addValue('2')">2</button>
        <button onclick="addValue('3')">3</button>
        <button class="operator" onclick="addValue('+')">+</button>

        <button class="zero" onclick="addValue('0')">0</button>
        <button onclick="addValue('.')">.</button>
        <button class="equal" onclick="calculate()">=</button>

    </div>
</div>

<script>
    const display = document.getElementById("display");

    function addValue(value) {
        if (display.value === "0" || display.value === "Error") {
            display.value = value;
        } else {
            display.value += value;
        }
    }

    function clearDisplay() {
        display.value = "0";
    }

    function deleteLast() {
        if (display.value === "Error" || display.value.length === 1) {
            display.value = "0";
        } else {
            display.value = display.value.slice(0, -1);
        }
    }

    function calculate() {
        try {
            let expression = display.value;

            if (!expression || /[+\-*/%.]$/.test(expression)) {
                display.value = "Error";
                return;
            }

            let result = eval(expression);

            if (!isFinite(result)) {
                display.value = "Error";
            } else {
                display.value = result;
            }

        } catch (error) {
            display.value = "Error";
        }
    }

    document.addEventListener("keydown", function(event) {
        const key = event.key;

        if (
            (key >= "0" && key <= "9") ||
            key === "+" ||
            key === "-" ||
            key === "*" ||
            key === "/" ||
            key === "%" ||
            key === "."
        ) {
            addValue(key);
        }
        else if (key === "Enter" || key === "=") {
            calculate();
        }
        else if (key === "Backspace") {
            deleteLast();
        }
        else if (key === "Escape") {
            clearDisplay();
        }
    });
</script>

</body>
</html>
